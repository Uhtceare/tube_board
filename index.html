<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rayners Lane">
<title>Rayners Lane Eastbound</title>
<style>
  :root { --amber: #ffb000; --dim: #7a5500; --bg: #000; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--amber);
    font-family: "Courier New", ui-monospace, monospace;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  }
  .board { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0 0 4px; letter-spacing: .05em; text-transform: uppercase; }
  .sub { color: var(--dim); font-size: .85rem; margin-bottom: 16px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 1.6em 1fr auto; gap: 0 10px; align-items: baseline;
    padding: 12px 0; border-bottom: 1px solid #222;
  }
  .num { color: var(--dim); }
  .dest { font-size: 1.15rem; font-weight: bold; text-transform: uppercase; }
  .eta { font-size: 1.3rem; font-weight: bold; text-align: right; white-space: nowrap; }
  .meta { grid-column: 2 / 4; display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--dim); margin-top: 4px; }
  .line { display: inline-block; padding: 1px 6px; border-radius: 3px; color: #fff; font-weight: bold; }
  .metropolitan { background: #9b0056; }
  .piccadilly { background: #003688; }
  .live { color: #3ddc84; font-weight: bold; }
  .msg { padding: 24px 0; color: var(--dim); }
  .status { margin-top: 16px; font-size: .8rem; color: var(--dim); display: flex; justify-content: space-between; }
  .status.error { color: #ff5050; }
  .clock { font-size: 1.6rem; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div class="board">
  <h1>Rayners Lane &middot; Eastbound</h1>
  <div class="sub">Metropolitan &amp; Piccadilly &middot; <span class="live">LIVE</span> = real-time, others timetabled</div>
  <ol id="list"><li class="msg">Loading…</li></ol>
  <div class="status" id="status"><span id="updated"></span><span id="next"></span></div>
  <div class="clock" id="clock"></div>
</div>
<script>
  const STOP_ID = '940GZZLURYL';
  const LINES = ['metropolitan', 'piccadilly'];
  const ARRIVALS_API = `https://api.tfl.gov.uk/Line/${LINES.join(',')}/Arrivals/${STOP_ID}`;
  // At Rayners Lane, TfL's "outbound" is eastbound for both lines (towards Aldgate / Cockfosters)
  const timetableApi = line => `https://api.tfl.gov.uk/Line/${line}/Timetable/${STOP_ID}?direction=outbound`;
  const REFRESH_SECONDS = 20;
  const TIMETABLE_MAX_AGE = 6 * 3600 * 1000;
  const MAX_ROWS = 6;
  // How far a live prediction may be from a timetabled departure to count as the same train
  const MATCH_EARLY = 3 * 60 * 1000;
  const MATCH_LATE = 10 * 60 * 1000;

  const timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' });
  const clockFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/London' });
  const partsFmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/London', hourCycle: 'h23',
    year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric',
  });

  let timetables = {};  // lineId -> { lineName, schedules: [{ name, journeys: [{ hour, minute, dest }] }] }
  let timetableAt = 0;
  let live = [];        // eastbound predictions, each with `at` = expected arrival (ms)
  let liveAt = 0;
  let rows = [];
  let nextFetchAt = 0;
  let timer = null;

  // ---- London time helpers ----

  function londonParts(t) {
    const p = {};
    for (const { type, value } of partsFmt.formatToParts(t)) p[type] = Number(value);
    return p;
  }

  // Timetable hours can be 24+ for trains after midnight; Date.UTC rolls those over
  function londonToUtc(y, month, d, h, min) {
    const guess = Date.UTC(y, month - 1, d, h, min);
    const p = londonParts(guess);
    return guess - (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - guess);
  }

  // ---- Timetable ----

  function parseTimetable(data) {
    const names = Object.fromEntries((data.stations || []).map(s => [s.id, s.name]));
    const schedules = [];
    for (const route of data.timetable.routes) {
      const dest = {};
      for (const si of route.stationIntervals) {
        dest[si.id] = names[si.intervals[si.intervals.length - 1].stopId] || '';
      }
      for (const s of route.schedules) {
        schedules.push({
          name: s.name,
          journeys: s.knownJourneys.map(j => ({ hour: +j.hour, minute: +j.minute, dest: dest[j.intervalId] })),
        });
      }
    }
    return { lineName: data.lineName, schedules };
  }

  async function loadTimetables() {
    const loaded = await Promise.all(LINES.map(async line => {
      const res = await fetch(timetableApi(line));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return parseTimetable(await res.json());
    }));
    LINES.forEach((line, i) => { timetables[line] = loaded[i]; });
    timetableAt = Date.now();
  }

  // Schedule names look like "Monday - Thursday", "Friday", "Saturdays and Public Holidays",
  // "Saturday (also Good Friday)", "Sunday"
  function matchesDay(name, day) {
    const n = name.toLowerCase();
    if (day === 0) return n.startsWith('sunday');
    if (day === 6) return n.startsWith('saturday');
    if (day === 5) return n.startsWith('friday') || n.includes('monday - friday');
    return n.startsWith('monday');
  }

  // TfL sometimes omits a weekday schedule (the Piccadilly has no "Monday - Thursday"),
  // so fall back to another weekday one
  function schedulesFor(tt, day) {
    const found = tt.schedules.filter(s => matchesDay(s.name, day));
    if (found.length || day === 0 || day === 6) return found;
    return tt.schedules.filter(s => /^(monday|friday)/i.test(s.name));
  }

  // Yesterday's service is included for trains after midnight (hour 24+)
  function scheduledDepartures() {
    const today = londonParts(Date.now());
    const out = [];
    for (const back of [1, 0]) {
      const date = new Date(Date.UTC(today.year, today.month - 1, today.day - back));
      const [y, month, d] = [date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate()];
      for (const [lineId, tt] of Object.entries(timetables)) {
        for (const s of schedulesFor(tt, date.getUTCDay())) {
          for (const j of s.journeys) {
            out.push({ lineId, lineName: tt.lineName, dest: j.dest, sched: londonToUtc(y, month, d, j.hour, j.minute) });
          }
        }
      }
    }
    return out;
  }

  // ---- Combining live and timetable ----

  function cleanName(name) {
    return (name || '').replace(/ Underground Station$/, '');
  }

  function buildRows() {
    const now = Date.now();
    const sched = scheduledDepartures()
      .filter(s => s.sched > now - MATCH_LATE)
      .sort((a, b) => a.sched - b.sched);
    const used = new Set();
    const out = [];

    for (const t of live) {
      let best = null;
      for (const s of sched) {
        if (used.has(s) || s.lineId !== t.lineId) continue;
        const diff = t.at - s.sched;
        if (diff < -MATCH_EARLY || diff > MATCH_LATE) continue;
        if (!best || Math.abs(diff) < Math.abs(t.at - best.sched)) best = s;
      }
      if (best) used.add(best);
      out.push({
        lineId: t.lineId, lineName: t.lineName, at: t.at, live: true, location: t.currentLocation,
        dest: t.destinationName || (best && best.dest), sched: best && best.sched,
      });
    }
    for (const s of sched) {
      if (!used.has(s)) out.push({ ...s, at: s.sched, live: false });
    }
    return out.sort((a, b) => a.at - b.at);
  }

  // ---- Fetching ----

  async function refresh() {
    clearTimeout(timer);
    const problems = [];

    if (Date.now() - timetableAt > TIMETABLE_MAX_AGE) {
      try { await loadTimetables(); } catch (err) { problems.push(`timetable ${err.message}`); }
    }
    try {
      const res = await fetch(ARRIVALS_API, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      liveAt = Date.now();
      live = data
        .filter(t => (t.platformName || '').includes('Eastbound'))
        .map(t => ({ ...t, at: liveAt + t.timeToStation * 1000 }))
        .sort((a, b) => a.at - b.at);
    } catch (err) {
      problems.push(`live ${err.message}`);
    }

    rows = buildRows();
    if (problems.length) setStatus(`Update failed (${problems.join(', ')}), retrying…`, true);
    else setStatus(`Updated ${timeFmt.format(liveAt)}`, false);

    nextFetchAt = Date.now() + REFRESH_SECONDS * 1000;
    render();
    if (!document.hidden) timer = setTimeout(refresh, REFRESH_SECONDS * 1000);
  }

  function setStatus(text, isError) {
    document.getElementById('updated').textContent = text;
    document.getElementById('status').classList.toggle('error', isError);
  }

  // ---- Rendering ----

  function render() {
    if (!liveAt && !timetableAt) return;
    const list = document.getElementById('list');
    const now = Date.now();
    const shown = rows.filter(r => r.at > now - 30 * 1000).slice(0, MAX_ROWS);

    if (!shown.length) {
      list.innerHTML = '<li class="msg">No eastbound trains found right now.</li>';
      return;
    }
    list.innerHTML = shown.map((r, i) => {
      const mins = Math.floor(Math.max(r.at - now, 0) / 60000);
      const eta = mins === 0 ? 'Due' : `${mins} min`;
      const status = r.live ? `<span class="live">LIVE</span> ${r.location || ''}` : 'Timetabled';
      let at = timeFmt.format(r.at);
      if (r.live && r.sched && Math.abs(r.at - r.sched) >= 60 * 1000) at += ` (sched ${timeFmt.format(r.sched)})`;
      return `<li>
        <span class="num">${i + 1}</span>
        <span class="dest">${cleanName(r.dest) || 'Check front of train'}</span>
        <span class="eta">${eta}</span>
        <div class="meta">
          <span><span class="line ${r.lineId}">${r.lineName}</span> ${status}</span>
          <span>${at}</span>
        </div>
      </li>`;
    }).join('');
  }

  function tick() {
    document.getElementById('clock').textContent = clockFmt.format(new Date());
    const left = Math.max(0, Math.ceil((nextFetchAt - Date.now()) / 1000));
    document.getElementById('next').textContent = nextFetchAt ? `Refresh in ${left}s` : '';
    render();
  }

  // Stop polling while the tab is in the background; refresh straight away on return
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer);
    else refresh();
  });

  refresh();
  setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
